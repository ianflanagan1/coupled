# COUPLED groups: values or code in several places that must change together. Each table is a
# group, named as its markers are searched for; its relations relate the sites, by the labels
# on their markers (`COUPLED:<key>: <label>`). Before changing a marked line, read every site
# of its group, change them together so every relation holds, then run `coupled`. See
# https://github.com/ianflanagan1/coupled.
version = 1

["COUPLED:cli-kit-version:"]
relations = ["flake = pyproject"]
select = { flake = 'cli-kit/(v[0-9.]+)', pyproject = 'tag = "([^"]+)"' }

["COUPLED:git-default-branch-version:"]
relations = ["flake = pyproject"]
select = { flake = 'git-default-branch/(v[0-9.]+)', pyproject = 'tag = "([^"]+)"' }

["COUPLED:repo-settings-version:"]
relations = ["flake = pyproject"]
select = { flake = 'repo-settings/(v[0-9.]+)', pyproject = 'tag = "([^"]+)"' }

# Written by coupled --update: each group as it was last reviewed. Don't edit below this line.

