version: '3'

tasks:
  check:
    desc: Ruff, the tests, then build the flake and lint this repository's tags with it
    cmds:
      - task: lint
      - task: test
      - task: tags

  setup:
    desc: Build .venv and link the command onto your PATH
    cmds:
      - uv sync
      - .venv/bin/python -m cli_kit.link .

  test:
    desc: Run the tests
    cmds:
      - uv run pytest --quiet

  lint:
    desc: Lint, and check formatting
    cmds:
      - uv run ruff check
      - uv run ruff format --check

  lint-file:
    desc: Format and fix the Python files given after --
    cmds:
      - |
        for f in {{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}; do
          case "$f" in
          *.py|*.pyi) uv run ruff format --quiet --force-exclude "$f" && uv run ruff check --quiet --fix --force-exclude "$f" || exit 1 ;;
          esac
        done

  copy-demo:
    desc: Copy examples/demo into a new git repository in a temporary directory, to try the lint and the hooks on
    cmds:
      # In place, the demo is inside this repository, whose settings exclude it, so the hooks
      # leave it alone, and --fix and --update would change the tracked copy.
      - |
        dir=$(mktemp -d)
        cp -R examples/demo/. "$dir"
        git -C "$dir" init --quiet
        git -C "$dir" add --all
        git -C "$dir" commit --quiet --message "The demo, as examples/demo has it"
        echo "$dir"

  tags:
    desc: Build the flake, then lint this repository's tags with the command it packages
    cmds:
      # .config/coupled.toml excludes the README's examples, the tests' fixtures and
      # examples/demo.
      - |
        out=$(nix --extra-experimental-features 'nix-command flakes' build .#coupled --no-link --print-out-paths)
        "$out/bin/coupled"
