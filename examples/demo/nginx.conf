server {
    listen 80;
    # Larger bodies get a 413 before they reach the app: COUPLED:upload-limit: nginx
    client_max_body_size 10m;
    proxy_read_timeout 65s;  # COUPLED:request-timeout: proxy. Gives the app time to answer first.

    location / {
        proxy_pass http://app:8080;
    }
}
