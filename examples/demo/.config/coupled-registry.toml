version = 1

["COUPLED:upload-limit:"]
relations = ["nginx >= app", "form = app", "app = ./config/limits.json#/upload_mb"]
select = { form = 'data-max-mb="(\d+)"' }
why = "nginx rejects a larger body with a 413 before the app sees it, and the form and the API's limits tell users the app's limit"

["COUPLED:request-timeout:"]
relations = ["proxy >= app + 5"]
why = "nginx must wait longer than the app, so the app's own timeout error reaches the client rather than a 504"

["COUPLED:port:"]
relations = ["compose = app"]
select = { compose = '"(\d+):' }
why = "compose publishes the port the app listens on"

["COUPLED:node-version:"]
relations = ["="]
files = ["./.nvmrc", "./.node-version?"]
why = "CI tests on the Node version the image and developers run"

["COUPLED:python-version:"]
relations = ["./.python-version = ./web/package.json#/engines/python-backend"]
why = "the web package's tooling runs the backend under the Python version it pins"

["COUPLED:breakpoint:"]
relations = ["css = ts"]
select = { css = 'max-width: (\d+)px' }
why = "the layout code switches to mobile at the width the stylesheet does"

["COUPLED:registry-path:"]
relations = ["owners = settings"]
select = { owners = '^/(\S+)' }
why = "CODEOWNERS must name the registry where the settings put it, or a change to it skips review"

["COUPLED:safe-name:"]
relations = ["same-as"]
why = "the browser and the server must make the same safe name from a filename"

["COUPLED:upload-shape:"]
relations = [
    "model same-shape table",
    "type same-shape model",
    "type same-shape //github.com/example/upload-api/schema/upload.json",
]
why = "the table stores, the model reads and the web receives one upload record, which the upload API's schema defines"

["COUPLED:upload-status:"]
relations = ["web subset-of app"]
why = "the web shows only statuses the app can give an upload"

