version = 1

["COUPLED:upload-limit:"]
relations = ["nginx <= cdn", "nginx >= app", "form = app", "api = app", "client = app * 1048576"]
has-no-marker = { api = "./config/limits.json#/upload_mb" }
why = "Cloudflare and then nginx reject a larger body with a 413 before the app sees it, the form and the API's limits tell users the app's limit, and the web client refuses a larger file, in bytes, before sending it"

["COUPLED:oauth-redirect:"]
relations = ["app = google"]
has-no-file = { google = "Google Cloud console > APIs & Services > Credentials > the web client > Authorised redirect URIs" }
why = "Google refuses to send a user back to a URI the client doesn't list"

["COUPLED:request-timeout:"]
relations = ["proxy >= app + 5", "balancer >= proxy", "proxy < client / 1000"]
in-another-registry = { balancer = "//github.com/example/infra" }
why = "nginx must wait longer than the app, and the load balancer longer than nginx, and the web client, counting in milliseconds, longer than nginx, so the app's own timeout error reaches the user rather than a 504"

["COUPLED:port:"]
relations = ["compose = app", "dev = app", "metrics != app"]
has-no-marker = { dev = { file = "./web/package.json", regex = 'localhost:(\d+)' } }
why = "compose publishes the port the app listens on, the web's dev server sends API calls to it, and metrics are served on a port of their own"

["COUPLED:node-version:"]
relations = ["ci = docker", "release = docker", "nvmrc = docker", "node-version-file = docker"]
has-no-marker = { nvmrc = "./.nvmrc", node-version-file = "./.node-version?" }
why = "CI tests, and a release is built, on the Node version the image and developers run"

["COUPLED:node-setup:"]
relations = ["ci same-text release"]
why = "a release is built with the steps CI tested, which two workflows can't share"

["COUPLED:python-version:"]
relations = ["python-version-file = web"]
has-no-marker = { python-version-file = "./.python-version", web = "./web/package.json#/engines/python-backend" }
why = "the web package's tooling runs the backend under the Python version it pins"

["COUPLED:breakpoint:"]
relations = ["css = ts", "desktop > css", "ts = desktop - 1"]
why = "the layout code switches to mobile at the width the stylesheet does, and the desktop layout starts one pixel above it"

["COUPLED:registry-path:"]
relations = ["owners = settings"]
why = "CODEOWNERS must name the registry where the settings put it, or a change to it skips review"

["COUPLED:safe-name:"]
relations = ["web same-as app", "docs description-of app"]
why = "the browser and the server must make the same safe name from a filename, as the docs say it's made"

["COUPLED:upload-shape:"]
relations = [
    "model same-shape table",
    "type same-shape model",
    "type same-shape api",
]
in-another-registry = { api = "//github.com/example/upload-api" }
why = "the table stores, the model reads and the web receives one upload record, which the upload API's schema defines"

["COUPLED:storage-event:"]
relations = ["handler same-shape vendor", "docs described-by handler"]
has-no-marker = { vendor = "//github.com/example-storage/notifications/schema/object-created.json#/properties" }
why = "the object store sends its notice in the shape its published schema gives, which the handler reads and the docs describe"

["COUPLED:upload-columns:"]
relations = ["model same-set table"]
why = "the model reads each column of the table by its name"

["COUPLED:upload-status:"]
relations = ["web subset-of app", "table proper-superset-of app", "new member-of app"]
why = "the web shows only statuses the app can give an upload, the table accepts every status the app gives as well as the ones a cleanup job sets, and a new upload starts in one of the app's statuses"

