version = 1

# Value ops: a directive, an assignment, an HTML attribute picked out by a selector, and a JSON
# file with a pointer.
["COUPLED:upload-limit:"]
relations = ["nginx >= app", "form = app", "app = ./config/limits.json#/upload_mb"]
select = { form = 'data-max-mb="(\d+)"' }

# A formula on the second value.
["COUPLED:request-timeout:"]
relations = ["proxy >= app + 5"]

# A selector where the line holds more than one value.
["COUPLED:port:"]
relations = ["compose = app"]
select = { compose = '"(\d+):' }

# A bare op: every site and file is the same. The CI site gives only the major version, which
# matches on the parts both give. A file marked `?` may be missing.
["COUPLED:node-version:"]
relations = ["="]
files = ["./.nvmrc", "./.node-version?"]

# Files alone, which can't hold a marker.
["COUPLED:python-version:"]
relations = ["./.python-version = ./web/package.json#/engines/python-backend"]

# A selector for CSS, whose line the lint can't read a value from.
["COUPLED:breakpoint:"]
relations = ["css = ts"]
select = { css = 'max-width: (\d+)px' }

# Structural ops: blocks closed by END, recorded in the reviewed section rather than compared.
["COUPLED:safe-name:"]
relations = ["same-as"]

["COUPLED:upload-shape:"]
relations = [
    "model same-shape table",
    "type same-shape model",
    "type same-shape //github.com/example/upload-api/schema/upload.json",
]

# Nested inside upload-shape's model block.
["COUPLED:upload-status:"]
relations = ["web subset-of app"]

