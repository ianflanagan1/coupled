[project]
name = "coupled"
version = "0.2.0"
description = "Checks the COUPLED:<key>: <label> markers in a repository against its registry of groups, and gives Claude Code hooks for them."
requires-python = ">=3.13"
dependencies = ["cli-kit", "repo-settings"]

[project.scripts]
coupled = "coupled.__main__:main"
coupled-hook = "coupled.__main__:hook"

[tool.uv.sources]
# COUPLED:cli-kit-version: pyproject
cli-kit = { git = "https://github.com/ianflanagan1/cli-kit", tag = "v0.1.0" }
# COUPLED:repo-settings-version: pyproject
repo-settings = { git = "https://github.com/ianflanagan1/repo-settings", tag = "v0.1.0" }
# repo-settings depends on it, and uv reads sources only from the project it's syncing.
# COUPLED:git-default-branch-version: pyproject
git-default-branch = { git = "https://github.com/ianflanagan1/git-default-branch", tag = "v0.1.0" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
# The demo stands in for another project, whose layout this project's formatter doesn't decide.
extend-exclude = ["examples/demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
